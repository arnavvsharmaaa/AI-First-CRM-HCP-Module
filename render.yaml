# Render Blueprint — free Postgres + free FastAPI web service, both in Singapore.
# DATABASE_URL is linked from the database by Render (internal URL); only
# GROQ_API_KEY has to be entered by hand when the Blueprint is created.

databases:
  - name: hcp-crm-db
    databaseName: hcp_crm
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: hcp-crm-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Replace with the Vercel URL once the frontend is deployed (comma-separated)
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: hcp-crm-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
