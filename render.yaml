# Render Blueprint — free FastAPI web service in Singapore.
# Postgres is hosted on Neon (free tier, no 30-day expiry like Render's free DB).
# Enter DATABASE_URL (Neon connection string) and GROQ_API_KEY by hand.

services:
  - type: web
    name: hcp-crm-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Replace with the Vercel URL once the frontend is deployed (comma-separated)
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
